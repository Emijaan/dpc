server {
    listen 80;
    server_name dpc.apinfotechandcybersolution.com 3.106.214.246 _;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location /static/ {
        alias /opt/akdevicelock/backend/staticfiles/;
    }

    location /app/ {
        alias /opt/akdevicelock/frontend/dist/;
        try_files $uri $uri/ /app/index.html;
    }

    location = /download/akdevicelock.apk {
        alias /etc/akdl/akdevicelock.apk;
        default_type application/vnd.android.package-archive;
        add_header Content-Disposition 'attachment; filename="akdevicelock.apk"';
    }

    location = /download/testdpc.apk {
        alias /etc/akdl/testdpc.apk;
        default_type application/vnd.android.package-archive;
        add_header Content-Disposition 'attachment; filename="TestDPC_9.0.12.apk"';
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 443 ssl;
    server_name dpc.apinfotechandcybersolution.com 3.106.214.246 _;

    ssl_certificate /etc/akdl/tls/fullchain.pem;
    ssl_certificate_key /etc/akdl/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 25M;

    location /static/ {
        alias /opt/akdevicelock/backend/staticfiles/;
    }

    location /app/ {
        alias /opt/akdevicelock/frontend/dist/;
        try_files $uri $uri/ /app/index.html;
    }

    location = /download/akdevicelock.apk {
        alias /etc/akdl/akdevicelock.apk;
        default_type application/vnd.android.package-archive;
        add_header Content-Disposition 'attachment; filename="akdevicelock.apk"';
    }

    location = /download/testdpc.apk {
        alias /etc/akdl/testdpc.apk;
        default_type application/vnd.android.package-archive;
        add_header Content-Disposition 'attachment; filename="TestDPC_9.0.12.apk"';
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
